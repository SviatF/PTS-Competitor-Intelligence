name: Exact Facebook Active Ads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/exactFacebookScan.ts'
      - '.github/workflows/exact-facebook.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --include=dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Scan exact Facebook pages
        run: xvfb-run -a npx tsx src/exactFacebookScan.ts
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-facebook-active-ads
          path: artifacts/exact-facebook
          if-no-files-found: warn
          retention-days: 3
