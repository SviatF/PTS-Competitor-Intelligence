name: Exact Facebook Production Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/exactProductionScan.ts'
      - 'src/telegram/TelegramNotifier.ts'
      - '.github/workflows/exact-facebook.yml'
  schedule:
    - cron: '*/5 * * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --include=dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Scan exact advertisers and notify Telegram
        run: xvfb-run -a npx tsx src/exactProductionScan.ts
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-facebook-production
          path: artifacts/exact-production
          if-no-files-found: ignore
          retention-days: 3

