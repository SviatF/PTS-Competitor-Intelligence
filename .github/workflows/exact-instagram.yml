name: Exact Instagram Active Ads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/exactInstagramScan.ts'
      - '.github/workflows/exact-instagram.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scan exact Instagram accounts
        run: npx tsx src/exactInstagramScan.ts

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-instagram-active-ads
          path: artifacts/exact-instagram
          if-no-files-found: warn
          retention-days: 3

# exact-account scan trigger
